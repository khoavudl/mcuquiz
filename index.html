<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCU Crossover Personality Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .marvel-red { color: #e23636; }
        .bg-marvel { background-color: #e23636; }
        .option-btn { transition: all 0.2s ease-in-out; }
        .option-btn:hover { border-color: #e23636; background-color: rgba(226, 54, 54, 0.1); transform: translateX(5px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container -->
    <div id="app-container" class="max-w-2xl w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        
        <!-- Start Screen -->
        <div id="start-screen" class="text-center py-10">
            <h1 class="text-4xl font-bold mb-4 uppercase tracking-wider">M<span class="marvel-red">C</span>U<br><span class="text-2xl text-slate-400">Multiverse Quiz</span></h1>
            <p class="text-slate-300 mb-8">Tính cách của bạn sẽ gọi tên ai trong MCU?</p>
            <button onclick="startQuiz()" class="bg-marvel hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full text-lg uppercase tracking-wide transition shadow-[0_0_15px_rgba(226,54,54,0.5)]">Bắt đầu ngay</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <span id="question-counter" class="text-slate-400 font-semibold">Câu 1/10</span>
                <div class="w-2/3 bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-marvel h-full w-10 transition-all duration-300"></div>
                </div>
            </div>
            
            <h2 id="question-text" class="text-2xl font-bold mb-6 text-white leading-snug">Question goes here?</h2>
            
            <div id="options-container" class="flex flex-col gap-4">
                <!-- Options will be injected here via JS -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center py-8">
            <h2 class="text-3xl font-bold mb-2">Hồ Sơ Đa Vũ Trụ Của Bạn</h2>
            <p class="text-slate-400 mb-8">Dựa trên những quyết định sâu thẳm nhất...</p>
            
            <div class="flex flex-col md:flex-row justify-center items-stretch gap-6 mb-8">
                <!-- Top 1 -->
                <div class="flex-1 bg-slate-700 border-2 border-marvel p-6 rounded-lg relative overflow-hidden">
                    <div class="absolute top-0 right-0 bg-marvel text-white font-bold px-3 py-1 text-sm rounded-bl-lg">TOP 1</div>
                    <div id="top1-percent" class="text-4xl font-black marvel-red mb-2">60%</div>
                    <h3 id="top1-name" class="text-2xl font-bold uppercase">Iron Man</h3>
                </div>
                
                <!-- Top 2 -->
                <div class="flex-1 bg-slate-700 border border-slate-600 p-6 rounded-lg relative opacity-90">
                    <div class="absolute top-0 right-0 bg-slate-500 text-white font-bold px-3 py-1 text-sm rounded-bl-lg">TOP 2</div>
                    <div id="top2-percent" class="text-3xl font-bold text-slate-300 mb-2">40%</div>
                    <h3 id="top2-name" class="text-xl font-bold uppercase text-slate-400">Doctor Strange</h3>
                </div>
            </div>

            <p id="result-message" class="text-lg italic text-slate-300 mb-8 px-4">"Message"</p>
            
            <button onclick="location.reload()" class="border border-slate-500 hover:bg-slate-700 text-white font-semibold py-2 px-6 rounded-full transition">Chơi lại lần nữa</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Track nhạc/thông điệp nào của Linkin Park phản chiếu chính xác nhất cuộc chiến nội tâm của bạn?",
                options: [
                    { text: "\"What I've Done\" – Sự dằn vặt về quá khứ và khao khát dùng năng lực để bù đắp.", scores: ["Iron Man", "Captain America"] },
                    { text: "\"Numb\" – Mệt mỏi vì kỳ vọng của người khác, khao khát phá vỡ khuôn mẫu.", scores: ["Loki", "Spider-Man"] },
                    { text: "\"Bleed It Out\" – Năng lượng bùng nổ, điên cuồng, sẵn sàng chiến đấu đến cùng.", scores: ["Thor", "Hela"] },
                    { text: "\"In The End\" – Bất lực khi nhận ra mọi thứ vẫn bị cuốn đi bởi quy luật tàn khốc.", scores: ["Thanos", "Dr. Doom", "Ultron"] }
                ]
            },
            {
                q: "Nếu đang ở trong một concert của Linkin Park, vị trí và hành động của bạn sẽ là:",
                options: [
                    { text: "Khu kỹ thuật (FOH), phân tích cách họ đánh synth, set up âm thanh và ánh sáng.", scores: ["Iron Man", "Ultron", "Dr. Doom"] },
                    { text: "Lao thẳng vào giữa mosh-pit, gào thét khản cổ và giải phóng năng lượng.", scores: ["Thor", "Hela"] },
                    { text: "Đứng lùi lại, khoanh tay cảm nhận sức nặng triết học trong từng lời hát.", scores: ["Doctor Strange", "Thanos"] },
                    { text: "Hát theo nhiệt tình nhưng luôn để ý xem bạn bè có bị xô đẩy hay không.", scores: ["Captain America", "Spider-Man"] }
                ]
            },
            {
                q: "Đâu là yếu tố âm nhạc trong LP đại diện cho cách bạn giải quyết vấn đề?",
                options: [
                    { text: "Rap của Mike Shinoda – Nhịp nhàng, sắc bén, tính toán logic và hệ thống.", scores: ["Iron Man", "Doctor Strange", "Dr. Doom"] },
                    { text: "Scream của Chester – Giải phóng cảm xúc mạnh mẽ, áp đảo mọi thứ xung quanh.", scores: ["Thor", "Hela", "Loki"] },
                    { text: "Pha trộn Rock và Hiphop – Tìm kiếm sự cân bằng và giải pháp dung hòa.", scores: ["Captain America", "Thanos"] },
                    { text: "Âm thanh điện tử kỳ lạ – Linh hoạt, phi truyền thống và luôn thích nghi.", scores: ["Spider-Man", "Ultron"] }
                ]
            },
            {
                q: "Cách bạn sẽ đoạt lấy Ngôi Báu Sắt (Westeros) là:",
                options: [
                    { text: "Dùng sức mạnh quân sự áp đảo, đốt rụi mọi thứ cản đường.", scores: ["Hela", "Thor"] },
                    { text: "Dùng trí tuệ, lập liên minh tài chính, thao túng các gia tộc lớn.", scores: ["Loki", "Iron Man"] },
                    { text: "Dùng quyền năng hắc ám, tri thức cổ xưa để ép tất cả quỳ gối.", scores: ["Dr. Doom", "Thanos", "Doctor Strange"] },
                    { text: "Tôi không cần ngai vàng. Tôi chiến đấu bảo vệ vương quốc khỏi Bóng Trắng.", scores: ["Captain America", "Spider-Man"] }
                ]
            },
            {
                q: "Sự kiện Huyết Hôn cướp đi đồng minh thân cận nhất. Phản xạ của bạn?",
                options: [
                    { text: "Nuốt hận, lên kế hoạch trả thù tỉ mỉ, hoàn hảo đến từng chi tiết cho 10 năm sau.", scores: ["Dr. Doom", "Thanos", "Ultron"] },
                    { text: "Nổi điên, xách vũ khí lao thẳng đến nhà kẻ thù để san bằng trong đêm.", scores: ["Thor", "Hela"] },
                    { text: "Tập hợp người sống sót, củng cố lực lượng bằng danh dự và niềm tin.", scores: ["Captain America", "Spider-Man"] },
                    { text: "Dùng mưu hèn kế bẩn, ảo ảnh để làm nội bộ kẻ thù tự tàn sát lẫn nhau.", scores: ["Loki", "Doctor Strange"] }
                ]
            },
            {
                q: "Gia ngôn (Motto) của gia tộc nào trong GoT giống triết lý sống của bạn nhất?",
                options: [
                    { text: "\"Winter is Coming\" – Luôn cảnh giác, chuẩn bị cho tình huống xấu nhất.", scores: ["Captain America", "Thanos", "Doctor Strange"] },
                    { text: "\"Fire and Blood\" – Chinh phạt, quyền lực tuyệt đối, chấp nhận bản ngã.", scores: ["Hela", "Ultron"] },
                    { text: "\"Hear Me Roar\" – Tự tôn cao ngất, di sản, và luôn trả đủ những món nợ.", scores: ["Iron Man", "Dr. Doom"] },
                    { text: "\"Growing Strong\" – Thích nghi, sinh tồn bằng sự khéo léo, ẩn giấu gai nhọn.", scores: ["Loki", "Spider-Man"] }
                ]
            },
            {
                q: "Chiếc Nón Phân Loại bối rối khi xếp bạn vào nhà nào ở Hogwarts?",
                options: [
                    { text: "Gryffindor/Slytherin: Cực kỳ dũng cảm nhưng cũng đầy tham vọng và kiêu hãnh.", scores: ["Iron Man", "Thor", "Loki"] },
                    { text: "Ravenclaw/Slytherin: Có trí tuệ thiên tài nhưng quá thực dụng, muốn kiểm soát.", scores: ["Doctor Strange", "Dr. Doom", "Ultron"] },
                    { text: "Hufflepuff/Gryffindor: Dũng cảm xả thân nhưng hành động vì tình yêu thương.", scores: ["Captain America", "Spider-Man"] },
                    { text: "Nón hét lên vì thấy tâm trí bạn quá hỗn mang, cực đoan và tăm tối.", scores: ["Thanos", "Hela"] }
                ]
            },
            {
                q: "Khi Ông kẹ (Boggart - nỗi sợ lớn nhất) xuất hiện, nó biến thành:",
                options: [
                    { text: "Bạn mất đi toàn bộ quyền lực, tri thức, trở thành kẻ bất lực.", scores: ["Dr. Doom", "Thanos", "Ultron"] },
                    { text: "Thi thể những người bạn yêu thương vì bạn không đủ sức mạnh cứu họ.", scores: ["Iron Man", "Spider-Man", "Captain America"] },
                    { text: "Một khoảng không nơi bạn bị lãng quên, coi thường, tước đoạt hào quang.", scores: ["Loki", "Hela"] },
                    { text: "Một thế giới nơi logic, phép thuật và quy luật tự nhiên hoàn toàn sụp đổ.", scores: ["Doctor Strange", "Thor"] }
                ]
            },
            {
                q: "Nếu chỉ được sở hữu một Bảo bối Tử thần, bạn chọn cái nào?",
                options: [
                    { text: "Đũa phép Cơm nguội – Sức mạnh áp đảo, uy quyền không ai đánh bại được.", scores: ["Hela", "Dr. Doom", "Thor"] },
                    { text: "Viên đá Phục sinh – Vì bạn không thể buông bỏ những mất mát trong quá khứ.", scores: ["Iron Man", "Thanos", "Captain America"] },
                    { text: "Áo choàng Tàng hình – Quan sát, trốn tránh rắc rối, làm việc trong bóng tối.", scores: ["Loki", "Spider-Man"] },
                    { text: "Tự nghiên cứu cách chúng được tạo ra và chế tác bảo bối vượt trội hơn.", scores: ["Doctor Strange", "Ultron"] }
                ]
            },
            {
                q: "Trường phái phép thuật nào thu hút bạn nhất?",
                options: [
                    { text: "Thần Hộ Mệnh – Phép thuật sinh ra từ ký ức hạnh phúc, khao khát bảo vệ.", scores: ["Captain America", "Spider-Man", "Thor"] },
                    { text: "Trường Sinh Linh Giá – Đảm bảo sự bất tử, di sản và vương quyền mãi mãi.", scores: ["Dr. Doom", "Ultron", "Hela"] },
                    { text: "Bế Quan Bí Thuật – Đọc thấu tâm trí, xây dựng pháo đài tinh thần bất khả xâm phạm.", scores: ["Loki", "Thanos"] },
                    { text: "Giả Kim Thuật & Biến Hình – Dùng trí tuệ định hình lại cấu trúc vật chất thế giới.", scores: ["Doctor Strange", "Iron Man"] }
                ]
            }
        ];

        let currentQuestion = 0;
        let userScores = {
            "Iron Man": 0, "Captain America": 0, "Thor": 0, "Spider-Man": 0, "Doctor Strange": 0,
            "Thanos": 0, "Loki": 0, "Dr. Doom": 0, "Hela": 0, "Ultron": 0
        };

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const qData = questions[currentQuestion];
            document.getElementById('question-counter').innerText = `Câu ${currentQuestion + 1}/${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            qData.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "option-btn text-left p-4 rounded-lg border border-slate-600 bg-slate-700 text-slate-200 text-lg hover:text-white";
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.scores);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(characterArray) {
            // Cộng điểm cho các nhân vật liên kết với đáp án
            characterArray.forEach(char => {
                userScores[char] += 1;
            });

            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            // Sắp xếp điểm từ cao xuống thấp
            const sortedChars = Object.entries(userScores).sort((a, b) => b[1] - a[1]);
            
            const top1 = sortedChars[0];
            const top2 = sortedChars[1];

            // Áp dụng Logic: Tính % dựa trên tổng điểm của Top 1 + Top 2
            const totalTopPoints = top1[1] + top2[1];
            const top1Percent = Math.round((top1[1] / totalTopPoints) * 100);
            const top2Percent = 100 - top1Percent; // Đảm bảo tổng luôn là 100%

            document.getElementById('top1-name').innerText = top1[0];
            document.getElementById('top1-percent').innerText = `${top1Percent}%`;
            
            document.getElementById('top2-name').innerText = top2[0];
            document.getElementById('top2-percent').innerText = `${top2Percent}%`;

            // Thông điệp bổ sung
            const msg = document.getElementById('result-message');
            msg.innerText = `Sâu thẳm bên trong, bạn mang bản ngã kiêu hãnh của ${top1[0]}, nhưng đôi khi, phần bóng tối/trách nhiệm của ${top2[0]} vẫn trỗi dậy dẫn lối quyết định của bạn.`;
        }
    </script>
</body>
</html>
